{% extends "admin/base.html" %}
{% block title %}Prijava{% endblock %}
{% block main %}
<div class="login">
  <h1>Administracija</h1>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form class="box" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div><label for="u">Korisničko ime</label><input type="text" id="u" name="username" autocomplete="username" required></div>
    <div><label for="pw">Lozinka</label><input type="password" id="pw" name="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Prijavi se</button>
  </form>
</div>
{% endblock %}
