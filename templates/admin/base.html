<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Administracija{% endblock %} · Academia de la Vida</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}?v=1">
</head>
<body>
{% if session.admin %}
<header><div class="in">
  <a class="brand" href="{{ url_for('admin_home') }}">ACADEMIA DE LA VIDA · ADMIN</a>
  {% set p = request.path %}
  <a href="{{ url_for('admin_applications') }}" class="{{ 'cur' if p.startswith('/admin/prijave') or p.startswith('/admin/odluka') }}">Prijave</a>
  <a href="{{ url_for('admin_members') }}" class="{{ 'cur' if p.startswith('/admin/clan') }}">Članovi</a>
  <a href="{{ url_for('admin_payments') }}" class="{{ 'cur' if p.startswith('/admin/uplate') }}">Uplate</a>
  <a href="{{ url_for('admin_decisions') }}" class="{{ 'cur' if p.startswith('/admin/odluke') }}">Odluke</a>
  <a href="{{ url_for('admin_outbox') }}" class="{{ 'cur' if p.startswith('/admin/poruke') }}">Poruke</a>
  <a href="{{ url_for('admin_newsletter') }}" class="{{ 'cur' if p.startswith('/admin/newsletter') }}">Newsletter</a>
  <a href="{{ url_for('admin_export_page') }}" class="{{ 'cur' if p.startswith('/admin/izvoz') }}">Izvoz</a>
  <form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button type="submit">Odjava ({{ session.admin }})</button></form>
</div></header>
{% endif %}
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block main %}{% endblock %}
</main>
</body>
</html>
